<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Reader Link</title><style>
:root{color-scheme:light dark;--bg:#fafbf8;--card:#fff;--fg:#263527;--muted:#6f786c;--line:#dfe5d9;--accent:#426342;font-family:system-ui,sans-serif;font-size:14px;color:var(--fg);background:var(--bg)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#20261f;--card:#2a3229;--fg:#e6eee3;--muted:#adbca6;--line:#43513e;--accent:#5e8156}}
:root[data-theme=dark]{--bg:#20261f;--card:#2a3229;--fg:#e6eee3;--muted:#adbca6;--line:#43513e;--accent:#5e8156}
*{box-sizing:border-box}body{margin:0;padding:22px}main{max-width:700px;margin:auto}header{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:42px;height:42px;border-radius:13px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:22px}h1{font-size:19px;font-weight:650;letter-spacing:-.5px;margin:0 0 4px}.eyebrow{font-size:11px;letter-spacing:1.2px;color:var(--muted)}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--card);color:var(--fg)}button:disabled{opacity:.5;cursor:default}#refresh{margin-left:auto;font-size:12px}#document{font-size:12px;color:var(--muted);overflow-wrap:anywhere}blockquote{white-space:pre-wrap;overflow-wrap:anywhere;margin:12px 0 20px;padding:18px 20px;border-left:3px solid #99b185;border-radius:0 12px 12px 0;background:var(--card);line-height:1.75;max-height:240px;overflow:auto}label[for=question]{display:block;font-weight:600;margin-bottom:8px}textarea{display:block;width:100%;min-height:98px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--card);color:var(--fg);font:inherit;line-height:1.6}textarea:focus-visible,button:focus-visible{outline:2px solid #8da978;outline-offset:3px}.save{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin:15px 0}input{accent-color:var(--accent)}#send{width:100%;background:var(--accent);color:#fff;border:0;font-weight:600}details{margin:18px 0;font-size:12px;color:var(--muted)}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:200px;overflow:auto;font:inherit;line-height:1.6}#status{font-size:12px;line-height:1.6;color:var(--muted);margin:16px 0 0}#empty{padding:32px 24px;background:var(--card);border:1px dashed var(--line);border-radius:14px;line-height:1.8}#empty strong{display:block;margin-bottom:8px}[hidden]{display:none!important}@media(max-width:380px){body{padding:14px}header{flex-wrap:wrap}#refresh{margin-left:54px}}
</style></head><body><main><header><div class="logo" aria-hidden="true">↗</div><div><h1>Paper Reader Link</h1><span class="eyebrow">읽던 문장에서, 대화로</span></div><button id="refresh" type="button" disabled>선택 문장 불러오기</button></header>
<div id="empty"><strong>읽고 있는 문장을 연결하세요</strong>Paper Reader에서 문장을 선택한 뒤, 질문을 입력하고 <b>Link로 보내기</b>를 누르세요.</div>
<section id="passage" hidden><p id="document"></p><blockquote id="quote"></blockquote><form id="form"><label for="question">이 문장에 관해 묻기</label><textarea id="question" maxlength="10000" required></textarea><label class="save"><input id="save" type="checkbox">답변을 PDF 주석으로 저장</label><button id="send" type="submit" disabled>이 ChatGPT 대화에서 질문하기 ↗</button></form><details><summary id="context-size">공유 문맥</summary><pre id="context"></pre></details></section>
<p id="status" role="status" aria-live="polite">ChatGPT 연결을 확인하고 있습니다…</p></main><script type="module">/*__WIDGET__*/</script></body></html>
